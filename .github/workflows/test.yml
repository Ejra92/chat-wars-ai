name: Test

on:
  push:
    branches: [ "feature/*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  run_tests:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1.1 Checkout code
        uses: actions/checkout@v4

      - name: 1.2 Node.js config (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1.3 Install dependencies
        run: npm ci

      - name: 3.4 Run suite test (npm test)
        run: npm test
