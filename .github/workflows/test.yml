name: Test

on:
  push:
    branches: ["feature/*"]
  pull_request:
    branches: ["*"]

jobs:
  run_tests:
    name: Run unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        contains(steps.check_pr.outputs.has_open_pr, 'true'))

    steps:
      - name: 0. Check if branch has open PR
        id: check_pr
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$PRS" -gt 0 ]; then
            echo "has_open_pr=true" >> $GITHUB_OUTPUT
          else
            echo "has_open_pr=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 1.1 Checkout code
        uses: actions/checkout@v4

      - name: 1.2 Node.js config (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1.3 Install dependencies
        run: npm ci

      - name: 1.4 Run suite test (npm test)
        run: npm test
