name: Next.js CI/CD Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  validate_project:
    name: Validar Lint, Build y Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar Lint (npm run lint)
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
          
      - name: 5. Ejecutar Build (npm run build)
        env:
          BASE_API_URL: ${{ secrets.BASE_API_URL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }} 
        run: npm run build

      - name: 6. Ejecutar Tests Unitarios (npm test)
        run: npm test

