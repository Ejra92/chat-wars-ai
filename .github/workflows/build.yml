name: Build

on:
  push:
    branches: ["feature/*"]
  pull_request:
    branches: ["*"]

jobs:
  check_pr:
    name: Check if branch has open PR
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check_pr_step.outputs.has_open_pr }}
    steps:
      - name: Check branch for open PR
        id: check_pr_step
        run: |
          # Obtener nombre de la rama de forma correcta según el evento
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          echo "Branch detected: $BRANCH"

          # contar PRs abiertos para esa rama
          PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' || echo "0")

          if [ "$PRS" -gt 0 ]; then
            echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_project:
    name: Run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check_pr

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && needs.check_pr.outputs.has_open_pr == 'true')

    steps:
      - name: 1.1 Checkout code
        uses: actions/checkout@v4

      - name: 1.2 Node.js config (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1.3 Install dependencies
        run: npm ci

      - name: 1.4 Run build (npm run build)
        run: npm run build
        env:
          BASE_API_URL: ${{ secrets.base_api_url }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.google_ai_key }}
