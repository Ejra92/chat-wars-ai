name: Lint

on:
  push:
    branches: [ "feature/*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint_validation:
    name: 1. Setup, Install y Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1.1 Checkout code
        uses: actions/checkout@v4

      - name: 1.2 Node.js config (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1.3 Install dependencies
        run: npm ci

      - name: 1.4 Run Linter (npm run lint)
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: 1