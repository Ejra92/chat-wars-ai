on:
  workflow_call:

jobs:
  lint_validation:
    name: Validate lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1.1 Checkout code
        uses: actions/checkout@v4

      - name: 1.2 Node.js config (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1.3 Install dependencies
        run: npm ci

      - name: 1.4 Run linter (npm run lint)
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
